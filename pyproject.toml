[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
# Do not check the folders that are not our own code.
exclude = ["^\\.venv/", "^llm_sdk/"]
# Our "llm_sdk" folder has no __init__.py, so it is not a package:
# this way mypy finds the real llm_sdk package that uv installed.
namespace_packages = false

# The llm_sdk package is given by the subject: we use it,
# but we do not show its errors (it is not our code).
[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_errors = true
# llm_sdk has no type information (py.typed), so we skip it quietly.
ignore_missing_imports = true
